[package]
name = "stellar-disaster-relief-payments"
version = "0.1.0"
edition = "2021"
description = "Stellar-based disaster relief and emergency payments platform"
authors = ["Disaster Relief Team"]
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
# IMPORTANT: soroban-sdk version must match the Soroban CLI and RPC node version
# used in deployment. A mismatch causes XDR serialisation incompatibilities.
# See docs/COMPATIBILITY.md for the full compatibility matrix.
soroban-sdk = "22.0.0"
soroban-token-sdk = "22.0.0"
# sha2 provides SHA-256 for all on-chain hashing (identity factors, recovery codes,
# duress PIN, device credential). Algorithm must match crypto-js SHA-256 in the
# TypeScript SDK — both produce lowercase hex output for identical inputs.
sha2 = "0.10.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4.3"

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
